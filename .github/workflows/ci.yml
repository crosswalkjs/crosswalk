name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the browser: GitHub's Ubuntu runners already have the libraries Chromium needs, and installing them
      # from Ubuntu's package mirror (--with-deps) failed whenever the mirror couldn't be reached.
      - run: npx playwright install chromium
      - run: npm run e2e
      # The report and traces, to see what the editor did when a test fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v5
      # The solution needs the .NET 10 SDK; the library targets, and is tested on, .NET 8.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test
      - run: dotnet pack src/Crosswalk.Core -c Release -o ../artifacts
